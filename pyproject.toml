[project]
name = "hyperscaler"
version = "0.1.0"
description = "INFERENCE — a datacenter tycoon simulator for serving LLMs at scale"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.8",
    "httpx>=0.27",  # used by fastapi.testclient for the server tests
]
notebook = [
    "matplotlib>=3.9",
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Treat this as a "virtual" project: uv installs dependencies into .venv but does not
# build/install our own code. Packages are importable from the repo root (cwd on sys.path;
# pytest uses pythonpath below). Add a [build-system] later if we want an installable wheel.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sim_core", "scenarios", "server"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sim_core", "scenarios", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    # Starlette's TestClient warns about httpx vs httpx2; not our code, not actionable yet.
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]
